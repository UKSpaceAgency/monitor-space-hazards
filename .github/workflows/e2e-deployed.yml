name: End-to-end tests (deployed site)

# Read-only Playwright suite that signs in as each test account and checks the live site.
# Run it from the Actions tab: "End-to-end tests (deployed site)" > "Run workflow".

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        required: true
        default: https://www.dev.monitor-space-hazards.service.gov.uk
      browser:
        description: Browser
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      roles:
        description: Test accounts for the role checks (all, or comma-separated, e.g. AgencySuperuser,SatelliteUser)
        required: true
        default: all
      suites:
        description: Which tests to run
        required: true
        default: all
        type: choice
        options:
          - all
          - coverage
          - public
          - access
          - features

concurrency:
  group: e2e-deployed
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ inputs.browser }}

      - name: Run tests
        env:
          CI: true
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_BROWSER: ${{ inputs.browser }}
          E2E_ROLES: ${{ inputs.roles }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ "${{ inputs.suites }}" = "all" ]; then
            pnpm test:e2e:deployed
          else
            pnpm test:e2e:deployed --project=${{ inputs.suites }}
          fi

      # The role × page matrix is also written to this run's summary page by the matrix reporter
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload traces and screenshots of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/deployed
          retention-days: 14
